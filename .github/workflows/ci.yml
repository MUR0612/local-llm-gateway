# Prepared for a future repository; not executed yet (no remote exists).
name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 valgrind
      - name: Build (warnings are errors in CI)
        run: make EXTRA_CFLAGS=-Werror
      - name: Unit and integration tests
        run: make test
      - name: ASan + UBSan
        run: make sanitize
      - name: ThreadSanitizer
        run: make tsan
      - name: Valgrind memcheck
        run: make valgrind
